<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet" />
    <title>Joetoro Launcher</title>
    <style>
        * { font-family: 'Outfit', sans-serif; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column; 
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000000; 
            overflow: hidden;
            padding: 20px;
        }
        #clock-container {
            position: absolute;
            bottom: 25px; 
            left: 30px;   
            text-align: left; 
            color: white;
            user-select: none;
            z-index: 10;
        }
        #time-display {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
        }
        #date-display {
            font-size: 14px;
            color: #888;
            margin-top: -2px;
            text-transform: uppercase;
        }
        .header-group {
            text-align: center;
            margin-top: 10vh;
            margin-bottom: 20px;
            color: white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }
        .header-group:hover { transform: perspective(500px) rotateX(5deg) rotateY(-5deg) scale(1.05); }
        h1 { font-size: 50px; margin: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .subtitle { font-size: 16px; color: #ffffff; margin-top: -2px; display: block; font-weight: 400; }
        .input-wrapper { position: relative; width: 400px; margin-bottom: 20px; }
        input[type="text"] {
            padding: 15px; padding-right: 45px; font-size: 18px; width: 100%;
            border: 5px solid #fff; border-radius: 5px; background-color: #fff; color: #000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type="text"]:focus { background-color: #000; color: #fff; outline: none; }
        .clear-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: #888; font-size: 22px;
            font-weight: bold; cursor: pointer; display: none; z-index: 5;
        }
        #launchBtn {
            display: block; width: 400px; padding: 20px; font-size: 38px;
            cursor: pointer; background-color: black; color: white; border: 5px solid white;
            border-radius: 5px; font-weight: 700; margin-top: 10px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #launchBtn:hover { transform: perspective(500px) rotateX(-2deg) rotateY(5deg) scale(1.05); }
        #launchBtn.error { background-color: darkred; }
        .joetoroogle-label {
            color: white;
            margin: 10px 0 4px 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .wip-note {
            color: #ffffff;
            font-size: 12px;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }
        #ticker-wrapper {
            width: 400px;
            overflow: hidden;
            margin-top: 18px;
            border-top: 1px solid #333;
            padding-top: 10px;
            white-space: nowrap;
        }
        #ticker-text {
            display: inline-block;
            color: #aaa;
            font-size: 14px;
            font-style: italic;
            white-space: nowrap;
            transform: translateX(400px);
        }
        /* Onboarding Overlay */
        #onboarding-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        #onboarding-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #onboarding-message {
            color: white;
            font-size: 22px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        #onboarding-once {
            color: #888;
            font-size: 13px;
            font-style: italic;
            margin-bottom: 28px;
            text-align: center;
        }
        #nameInput {
            display: block;
            width: 400px;
            padding: 20px;
            font-size: 28px;
            cursor: text;
            background-color: black;
            color: white;
            border: 5px solid white;
            border-radius: 5px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #nameInput::placeholder {
            color: #555;
            font-weight: 400;
            font-size: 20px;
        }
        #nameInput:focus {
            background-color: #fff;
            color: #000;
        }
        #nameSubmitBtn {
            display: block;
            width: 400px;
            padding: 20px;
            font-size: 38px;
            cursor: pointer;
            background-color: black;
            color: white;
            border: 5px solid white;
            border-radius: 5px;
            font-weight: 700;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #nameSubmitBtn:hover { transform: perspective(500px) rotateX(-2deg) rotateY(5deg) scale(1.05); }
        #welcome-label {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            min-height: 30px;
        }
    </style>
</head>
<body>

<!-- Onboarding Overlay -->
<div id="onboarding-overlay">
    <div id="onboarding-message">
        hi guys. to add the illusion of personalization, i'm going to ask your name. input it in this big box below :))
    </div>
    <div id="onboarding-once">you only have to do this once</div>
    <input type="text" id="nameInput" placeholder="your name..." autocorrect="off" autocapitalize="off" maxlength="30" />
    <button id="nameSubmitBtn" onclick="submitName()">Let's go</button>
</div>

<div id="clock-container">
    <p id="time-display">00:00:00</p>
    <p id="date-display">LOADING...</p>
</div>

<div id="ui-container" class="header-group">
    <div id="welcome-label"></div>
    <h1>Joetoro Launcher</h1>
    <span class="subtitle">v.1.63 | By Forest</span>
</div>

<!-- URL Launcher Input -->
<div class="input-wrapper">
    <input type="text" id="urlInput" placeholder="enter here :)" autocorrect="off" autocapitalize="off" />
    <button id="clearBtn" class="clear-btn" title="Clear input">&times;</button>
</div>

<!-- Joetoroogle Section -->
<div class="joetoroogle-label">search joetoroogle</div>
<div class="wip-note">big WIP, google has many restrictions on embedding</div>
<div class="input-wrapper">
    <input type="text" id="googleInput" placeholder="search query..." autocorrect="off" autocapitalize="off" />
    <button id="googleClearBtn" class="clear-btn" title="Clear input">&times;</button>
</div>

<!-- Launch Button -->
<button id="launchBtn" onclick="handleUnifiedLaunch()">Launch</button>

<!-- Scrolling Ticker -->
<div id="ticker-wrapper">
    <span id="ticker-text"></span>
</div>

<script>
    // ─── STORAGE ─────────────────────────────────────────────────────────────
    // Saves to localStorage AND a cookie as backup.
    // The cookie no longer uses "Secure" so it works on file:// and http://.
    function saveName(name) {
        try { localStorage.setItem('joetoro_username', name); } catch(e) {}
        const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = 'joetoro_username=' + encodeURIComponent(name)
            + '; expires=' + expires + '; path=/; SameSite=Lax';
        // Hash fallback for environments that block both (e.g. strict private mode)
        try { window.location.hash = 'user=' + encodeURIComponent(name); } catch(e) {}
    }

    function loadName() {
        // 1. localStorage
        try {
            const ls = localStorage.getItem('joetoro_username');
            if (ls) return ls;
        } catch(e) {}
        // 2. Cookie
        const cookieMatch = document.cookie.match(/(?:^|;\s*)joetoro_username=([^;]+)/);
        if (cookieMatch) return decodeURIComponent(cookieMatch[1]);
        // 3. URL hash (survives hard refresh but not browser close — last resort)
        const hashMatch = window.location.hash.match(/user=([^&]+)/);
        if (hashMatch) return decodeURIComponent(hashMatch[1]);
        return null;
    }

    // ─── ONBOARDING ──────────────────────────────────────────────────────────
    const overlay      = document.getElementById('onboarding-overlay');
    const nameInput    = document.getElementById('nameInput');
    const welcomeLabel = document.getElementById('welcome-label');

    function checkOnboarding() {
        const savedName = loadName();
        if (savedName) {
            // Already onboarded — skip straight to the launcher
            overlay.style.display = 'none';
            welcomeLabel.textContent = 'welcome back, ' + savedName + ' :)';
        }
        // If no saved name: overlay stays visible, user must go through onboarding
    }

    function submitName() {
        const name = nameInput.value.trim();
        if (!name) {
            nameInput.value = '';
            nameInput.placeholder = 'you have to put something lol';
            return;
        }
        saveName(name);
        welcomeLabel.textContent = 'welcome, ' + name + ' :)';
        overlay.classList.add('fade-out');
        setTimeout(() => { overlay.style.display = 'none'; }, 850);
    }

    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });

    // Run onboarding check immediately on page load
    checkOnboarding();

    // ─── CLOCK ───────────────────────────────────────────────────────────────
    function updateClock() {
        const now = new Date();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('time-display').textContent =
            new Intl.DateTimeFormat('en-GB', timeOptions).format(now);
        const dateOptions = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
        document.getElementById('date-display').textContent =
            new Intl.DateTimeFormat('en-US', dateOptions).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── URL / SEARCH INPUTS ─────────────────────────────────────────────────
    const urlInput      = document.getElementById('urlInput');
    const clearBtn      = document.getElementById('clearBtn');
    const googleInput   = document.getElementById('googleInput');
    const googleClearBtn = document.getElementById('googleClearBtn');

    urlInput.addEventListener('keydown', (e) => e.key === 'Enter' && handleUnifiedLaunch());
    urlInput.addEventListener('input',   () => {
        clearBtn.style.display = urlInput.value.length > 0 ? 'block' : 'none';
    });
    clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        clearBtn.style.display = 'none';
        urlInput.focus();
    });

    googleInput.addEventListener('keydown', (e) => e.key === 'Enter' && handleUnifiedLaunch());
    googleInput.addEventListener('input', () => {
        googleClearBtn.style.display = googleInput.value.length > 0 ? 'block' : 'none';
    });
    googleClearBtn.addEventListener('click', () => {
        googleInput.value = '';
        googleClearBtn.style.display = 'none';
        googleInput.focus();
    });

    // ─── LAUNCH LOGIC ────────────────────────────────────────────────────────
    function openEmbeddedPage(url) {
        const newWin = window.open('', '_blank');
        if (newWin) {
            newWin.location.href = url;
        } else {
            window.location.href = url;
        }
    }

    function executeActualGoogleSearch(query) {
        const encoded = encodeURIComponent(query);
        openEmbeddedPage('https://duckduckgo.com/?q=' + encoded);
    }

    function handleUnifiedLaunch() {
        const urlVal    = document.getElementById('urlInput').value.trim();
        const googleVal = document.getElementById('googleInput').value.trim();
        if (!urlVal && !googleVal) {
            alert('Please enter a value');
            return;
        }
        if (urlVal) {
            let url = urlVal;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            openEmbeddedPage(url);
        } else {
            executeActualGoogleSearch(googleVal);
        }
    }

    // ─── TICKER ──────────────────────────────────────────────────────────────
    const tickerMessages = [
        "veck.io is peak",
        "yes darling",
        "come ask forest if the url changes and you get a 404 error"
    ];
    let tickerIndex = 0;
    const tickerEl   = document.getElementById('ticker-text');
    const wrapperWidth = 400;

    function runTicker() {
        tickerEl.textContent = tickerMessages[tickerIndex];
        const textWidth     = tickerEl.offsetWidth;
        const totalDistance = wrapperWidth + textWidth;
        const duration      = totalDistance / 80; // 80px/s

        tickerEl.style.transition = 'none';
        tickerEl.style.transform  = `translateX(${wrapperWidth}px)`;
        void tickerEl.offsetWidth; // force reflow
        tickerEl.style.transition = `transform ${duration}s linear`;
        tickerEl.style.transform  = `translateX(-${textWidth}px)`;

        tickerIndex = (tickerIndex + 1) % tickerMessages.length;
        setTimeout(runTicker, duration * 1000 + 500);
    }
    setTimeout(runTicker, 300);
</script>
</body>
</html>
