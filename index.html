<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet" />
    <title>Joetoro Launcher</title>
    <style>
        * { font-family: 'Outfit', sans-serif; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            min-height: 100vh; margin: 0;
            background-color: #000000; overflow: hidden; padding: 20px;
        }
        #clock-container {
            position: absolute; bottom: 25px; left: 30px;
            text-align: left; color: white; user-select: none; z-index: 10;
        }
        #time-display { font-size: 32px; font-weight: 700; letter-spacing: 1px; margin: 0; }
        #date-display { font-size: 14px; color: #888; margin-top: -2px; text-transform: uppercase; }
        .header-group {
            text-align: center; margin-top: 10vh; margin-bottom: 20px; color: white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: default;
        }
        .header-group:hover { transform: perspective(500px) rotateX(5deg) rotateY(-5deg) scale(1.05); }
        h1 { font-size: 50px; margin: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .subtitle { font-size: 16px; color: #ffffff; margin-top: -2px; display: block; font-weight: 400; }
        .input-wrapper { position: relative; width: 400px; margin-bottom: 20px; }
        input[type="text"] {
            padding: 15px; padding-right: 45px; font-size: 18px; width: 100%;
            border: 5px solid #fff; border-radius: 5px; background-color: #fff; color: #000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        input[type="text"]:focus { background-color: #000; color: #fff; outline: none; }
        .clear-btn {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: #888; font-size: 22px;
            font-weight: bold; cursor: pointer; display: none; z-index: 5;
        }
        #launchBtn {
            display: block; width: 400px; padding: 20px; font-size: 38px;
            cursor: pointer; background-color: black; color: white; border: 5px solid white;
            border-radius: 5px; font-weight: 700; margin-top: 10px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #launchBtn:hover { transform: perspective(500px) rotateX(-2deg) rotateY(5deg) scale(1.05); }
        .joetoroogle-label {
            color: white; margin: 10px 0 4px 0; font-size: 20px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
        }
        .wip-note {
            color: #ffffff; font-size: 12px; font-style: italic;
            margin-top: 0; margin-bottom: 10px; text-align: center;
        }
        #ticker-wrapper {
            width: 400px; overflow: hidden; margin-top: 18px;
            border-top: 1px solid #333; padding-top: 10px; white-space: nowrap;
        }
        #ticker-text {
            display: inline-block; color: #aaa; font-size: 14px;
            font-style: italic; white-space: nowrap; transform: translateX(400px);
        }

        /* AI Button */
        #aiBtn {
            display: block; width: 400px; padding: 14px; font-size: 22px;
            cursor: pointer; background-color: black; color: #aaa;
            border: 5px solid #444; border-radius: 5px; font-weight: 700;
            margin-top: 12px; letter-spacing: 1px; text-transform: uppercase;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s, color 0.2s;
        }
        #aiBtn:hover { border-color: #fff; color: #fff; transform: perspective(500px) rotateX(-2deg) rotateY(5deg) scale(1.05); }

        /* AI Overlay */
        #ai-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0,0,0,0.92);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 8888; padding: 20px;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #ai-overlay.open { display: flex; }
        #ai-overlay.visible { opacity: 1; }
        #ai-modal {
            width: 100%; max-width: 560px; background: #000; border: 5px solid #fff;
            border-radius: 8px; display: flex; flex-direction: column;
            height: 70vh; max-height: 600px;
        }
        #ai-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 3px solid #fff;
        }
        #ai-modal-header span {
            color: #fff; font-size: 20px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
        }
        #ai-close-btn {
            background: transparent; border: none; color: #fff;
            font-size: 28px; cursor: pointer; line-height: 1; transition: color 0.2s;
        }
        #ai-close-btn:hover { color: #888; }
        #ai-messages {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: thin; scrollbar-color: #333 transparent;
        }
        #ai-messages::-webkit-scrollbar { width: 4px; }
        #ai-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .msg {
            max-width: 85%; padding: 12px 16px; border-radius: 6px;
            font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
        }
        .msg.user { align-self: flex-end; background: #fff; color: #000; border: 3px solid #fff; }
        .msg.assistant { align-self: flex-start; background: #000; color: #fff; border: 3px solid #fff; }
        .msg.assistant.thinking { color: #555; border-color: #333; font-style: italic; }
        .url-chip {
            display: inline-block; margin-top: 8px; margin-right: 6px;
            background: #fff; color: #000; border-radius: 4px;
            padding: 4px 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        .url-chip:hover { background: #ddd; }
        #ai-input-row { display: flex; border-top: 3px solid #fff; }
        #ai-input {
            flex: 1; padding: 14px 16px; font-size: 16px;
            background: #000; color: #fff; border: none; outline: none;
            font-family: 'Outfit', sans-serif; resize: none; height: 56px;
        }
        #ai-input::placeholder { color: #444; }
        #ai-send-btn {
            padding: 14px 20px; background: #fff; color: #000;
            border: none; font-size: 20px; cursor: pointer;
            font-weight: 700; font-family: 'Outfit', sans-serif; transition: background 0.2s;
        }
        #ai-send-btn:hover { background: #ccc; }
        #ai-send-btn:disabled { background: #333; color: #666; cursor: default; }

        /* Onboarding Overlay */
        #onboarding-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
            opacity: 1; transition: opacity 0.8s ease;
        }
        #onboarding-overlay.fade-out { opacity: 0; pointer-events: none; }
        #onboarding-message {
            color: white; font-size: 22px; text-align: center;
            max-width: 500px; line-height: 1.6; margin-bottom: 8px;
        }
        #onboarding-once {
            color: #888; font-size: 13px; font-style: italic;
            margin-bottom: 28px; text-align: center;
        }
        #nameInput {
            display: block; width: 400px; padding: 20px; font-size: 28px;
            cursor: text; background-color: black; color: white;
            border: 5px solid white; border-radius: 5px; font-weight: 700;
            margin-bottom: 16px; text-align: center; outline: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #nameInput::placeholder { color: #555; font-weight: 400; font-size: 20px; }
        #nameInput:focus { background-color: #fff; color: #000; }
        #nameSubmitBtn {
            display: block; width: 400px; padding: 20px; font-size: 38px;
            cursor: pointer; background-color: black; color: white;
            border: 5px solid white; border-radius: 5px; font-weight: 700;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #nameSubmitBtn:hover { transform: perspective(500px) rotateX(-2deg) rotateY(5deg) scale(1.05); }
        #welcome-label {
            color: #ffffff; font-size: 22px; font-weight: 600;
            text-align: center; margin-bottom: 6px; min-height: 30px;
        }
    </style>
</head>
<body>

<!-- =============================================================
     PASTE YOUR GROQ API KEY BELOW
     Get one free (no credit card) at: https://console.groq.com
     API Keys tab → Create API Key → copy the gsk_... key
============================================================== -->
<script>
    const GROQ_API_KEY = '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';
</script>

<!-- Onboarding Overlay -->
<div id="onboarding-overlay">
    <div id="onboarding-message">
        hi guys. to add the illusion of personalization, i'm going to ask your name. input it in this big box below :))
    </div>
    <div id="onboarding-once">you only have to do this once</div>
    <input type="text" id="nameInput" placeholder="your name..." autocorrect="off" autocapitalize="off" maxlength="30" />
    <button id="nameSubmitBtn" onclick="submitName()">Let's go</button>
</div>

<!-- AI Overlay -->
<div id="ai-overlay">
    <div id="ai-modal">
        <div id="ai-modal-header">
            <span>✦ Joetoro AI</span>
            <button id="ai-close-btn" onclick="closeAI()">×</button>
        </div>
        <div id="ai-messages"></div>
        <div id="ai-input-row">
            <textarea id="ai-input" placeholder="ask anything, or ask for a site to launch..."></textarea>
            <button id="ai-send-btn" onclick="sendMessage()">↑</button>
        </div>
    </div>
</div>

<div id="clock-container">
    <p id="time-display">00:00:00</p>
    <p id="date-display">LOADING...</p>
</div>

<div id="ui-container" class="header-group">
    <div id="welcome-label"></div>
    <h1>Joetoro Launcher</h1>
    <span class="subtitle">v.1.63 | By Forest</span>
</div>

<div class="input-wrapper">
    <input type="text" id="urlInput" placeholder="enter here :)" autocorrect="off" autocapitalize="off" />
    <button id="clearBtn" class="clear-btn" title="Clear input">&times;</button>
</div>

<div class="joetoroogle-label">search joetoroogle</div>
<div class="wip-note">big WIP, google has many restrictions on embedding</div>
<div class="input-wrapper">
    <input type="text" id="googleInput" placeholder="search query..." autocorrect="off" autocapitalize="off" />
    <button id="googleClearBtn" class="clear-btn" title="Clear input">&times;</button>
</div>

<button id="launchBtn" onclick="handleUnifiedLaunch()">Launch</button>
<button id="aiBtn" onclick="openAI()">✦ Ask Joetoro AI</button>

<div id="ticker-wrapper">
    <span id="ticker-text"></span>
</div>

<script>
// ─── STORAGE ─────────────────────────────────────────────────────────────────
function saveName(name) {
    try { localStorage.setItem('joetoro_username', name); } catch(e) {}
    const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
    document.cookie = 'joetoro_username=' + encodeURIComponent(name)
        + '; expires=' + expires + '; path=/; SameSite=Lax';
    try { window.location.hash = 'user=' + encodeURIComponent(name); } catch(e) {}
}

function loadName() {
    try {
        const ls = localStorage.getItem('joetoro_username');
        if (ls) return ls;
    } catch(e) {}
    const cookieMatch = document.cookie.match(/(?:^|;\s*)joetoro_username=([^;]+)/);
    if (cookieMatch) return decodeURIComponent(cookieMatch[1]);
    const hashMatch = window.location.hash.match(/user=([^&]+)/);
    if (hashMatch) return decodeURIComponent(hashMatch[1]);
    return null;
}

// ─── ONBOARDING ──────────────────────────────────────────────────────────────
const overlay      = document.getElementById('onboarding-overlay');
const nameInputEl  = document.getElementById('nameInput');
const welcomeLabel = document.getElementById('welcome-label');

function checkOnboarding() {
    const savedName = loadName();
    if (savedName) {
        overlay.style.display = 'none';
        welcomeLabel.textContent = 'welcome back, ' + savedName + ' :)';
    }
}

function submitName() {
    const name = nameInputEl.value.trim();
    if (!name) {
        nameInputEl.value = '';
        nameInputEl.placeholder = 'you have to put something lol';
        return;
    }
    saveName(name);
    welcomeLabel.textContent = 'welcome, ' + name + ' :)';
    overlay.classList.add('fade-out');
    setTimeout(() => { overlay.style.display = 'none'; }, 850);
}

nameInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });
checkOnboarding();

// ─── CLOCK ───────────────────────────────────────────────────────────────────
function updateClock() {
    const now = new Date();
    document.getElementById('time-display').textContent =
        new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(now);
    document.getElementById('date-display').textContent =
        new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' }).format(now);
}
setInterval(updateClock, 1000);
updateClock();

// ─── URL / SEARCH INPUTS ─────────────────────────────────────────────────────
const urlInput       = document.getElementById('urlInput');
const clearBtn       = document.getElementById('clearBtn');
const googleInput    = document.getElementById('googleInput');
const googleClearBtn = document.getElementById('googleClearBtn');

urlInput.addEventListener('keydown', (e) => e.key === 'Enter' && handleUnifiedLaunch());
urlInput.addEventListener('input',   () => { clearBtn.style.display = urlInput.value.length > 0 ? 'block' : 'none'; });
clearBtn.addEventListener('click',   () => { urlInput.value = ''; clearBtn.style.display = 'none'; urlInput.focus(); });

googleInput.addEventListener('keydown', (e) => e.key === 'Enter' && handleUnifiedLaunch());
googleInput.addEventListener('input',   () => { googleClearBtn.style.display = googleInput.value.length > 0 ? 'block' : 'none'; });
googleClearBtn.addEventListener('click', () => { googleInput.value = ''; googleClearBtn.style.display = 'none'; googleInput.focus(); });

function openEmbeddedPage(url) {
    const newWin = window.open('', '_blank');
    if (newWin) { newWin.location.href = url; } else { window.location.href = url; }
}

function handleUnifiedLaunch() {
    const urlVal    = urlInput.value.trim();
    const googleVal = googleInput.value.trim();
    if (!urlVal && !googleVal) { alert('Please enter a value'); return; }
    if (urlVal) {
        let url = urlVal;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        openEmbeddedPage(url);
    } else {
        openEmbeddedPage('https://duckduckgo.com/?q=' + encodeURIComponent(googleVal));
    }
}

// ─── AI CHAT (GROQ - FREE) ───────────────────────────────────────────────────
const aiOverlay  = document.getElementById('ai-overlay');
const aiMessages = document.getElementById('ai-messages');
const aiInput    = document.getElementById('ai-input');
const aiSendBtn  = document.getElementById('ai-send-btn');

let chatHistory = [];
let aiGreeted   = false;

function openAI() {
    aiOverlay.classList.add('open');
    requestAnimationFrame(() => aiOverlay.classList.add('visible'));
    if (!aiGreeted) {
        aiGreeted = true;
        const userName = loadName() || 'there';
        appendMessage('assistant', `hey ${userName} what's up. ask me anything or tell me what you wanna open and i'll find it`);
    }
    setTimeout(() => aiInput.focus(), 300);
}

function closeAI() {
    aiOverlay.classList.remove('visible');
    setTimeout(() => aiOverlay.classList.remove('open'), 300);
}

aiOverlay.addEventListener('click', (e) => { if (e.target === aiOverlay) closeAI(); });
aiInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function appendMessage(role, text, isThinking) {
    const div = document.createElement('div');
    div.className = 'msg ' + role + (isThinking ? ' thinking' : '');

    if (role === 'assistant' && !isThinking) {
        const urlRegex = /https?:\/\/[^\s)>\]"',]+/g;
        const urls = [...new Set(text.match(urlRegex) || [])];
        div.textContent = text;
        urls.forEach(url => {
            const chip = document.createElement('div');
            chip.className = 'url-chip';
            chip.textContent = '⬡ Launch: ' + url.replace(/^https?:\/\//, '');
            chip.title = url;
            chip.onclick = () => openEmbeddedPage(url);
            div.appendChild(chip);
        });
    } else {
        div.textContent = text;
    }

    aiMessages.appendChild(div);
    aiMessages.scrollTop = aiMessages.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = aiInput.value.trim();
    if (!text) return;

    if (GROQ_API_KEY === 'YOUR_GROQ_API_KEY_HERE') {
        appendMessage('assistant', '⚠️ no api key set! open the html file and replace YOUR_GROQ_API_KEY_HERE with your key from console.groq.com — it starts with gsk_');
        return;
    }

    aiInput.value = '';
    aiSendBtn.disabled = true;
    appendMessage('user', text);
    chatHistory.push({ role: 'user', content: text });

    const thinkingEl = appendMessage('assistant', 'thinking...', true);

    try {
        const userName = loadName() || 'the user';
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + GROQ_API_KEY
            },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                max_tokens: 1000,
                messages: [
                    {
                        role: 'system',
                        content: `you are joetoro AI, a chill assistant living inside the joetoro launcher. the user's name is ${userName}. you talk like a real person texting their friend — lowercase almost always, short sentences, no fluff, no filler phrases like "certainly!" or "great question!" or "of course!". never say things like "i'd be happy to help" or "as an AI". just answer like a normal person would. if something's funny, be funny. if it's simple, keep it short. when the user wants a site to launch, include the full https:// URL somewhere in your reply so it shows up as a launch button. no bullet points, no lists unless they actually make sense, no markdown.`
                    },
                    ...chatHistory
                ]
            })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'API error ' + res.status);

        const reply = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: reply });
        thinkingEl.remove();
        appendMessage('assistant', reply);
    } catch (err) {
        thinkingEl.remove();
        appendMessage('assistant', '⚠️ error: ' + err.message);
    }

    aiSendBtn.disabled = false;
    aiInput.focus();
}

// ─── TICKER ──────────────────────────────────────────────────────────────────
const tickerMessages = [
    "veck.io is peak",
    "yes darling",
    "come ask forest if the url changes and you get a 404 error"
];
let tickerIndex = 0;
const tickerEl  = document.getElementById('ticker-text');

function runTicker() {
    tickerEl.textContent = tickerMessages[tickerIndex];
    const textWidth = tickerEl.offsetWidth;
    const duration  = (400 + textWidth) / 80;
    tickerEl.style.transition = 'none';
    tickerEl.style.transform  = 'translateX(400px)';
    void tickerEl.offsetWidth;
    tickerEl.style.transition = `transform ${duration}s linear`;
    tickerEl.style.transform  = `translateX(-${textWidth}px)`;
    tickerIndex = (tickerIndex + 1) % tickerMessages.length;
    setTimeout(runTicker, duration * 1000 + 500);
}
setTimeout(runTicker, 300);
</script>
</body>
</html>
